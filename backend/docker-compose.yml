services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careercratly_api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CareerCratly.AI
      ENVIRONMENT: development
      DEBUG: "true"
      API_PREFIX: /api
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      STORAGE_BACKEND: local
      UPLOAD_DIR: uploads
      MAX_RESUME_SIZE_BYTES: "5242880"
      PRELOAD_EXTRACTOR: "true"
      JOB_PROVIDER: mock
      COURSE_PROVIDER: mock
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
      - upload_data:/app/uploads

volumes:
  upload_data:
